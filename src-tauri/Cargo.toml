[package]
name = "conceit"
version = "0.1.7"
description = "Conceit（幻想阅读器）— 本地漫画阅读器"
authors = ["Conceit"]
edition = "2021"

[lib]
name = "conceit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 仅保留生成封面缩略图需要的解码器（jpg/png/webp/gif/bmp），关闭默认特性以控制体积
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
] }

[profile.release]
# 不用 panic = "abort"：解码 / 解压路径靠 catch_unwind 把库内 panic
# 降级成单部漫画的导入失败，abort 会让 catch_unwind 失效、进程直接被杀
codegen-units = 1
lto = true
opt-level = "s"
strip = true
